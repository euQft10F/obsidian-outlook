[project]
name = "email-vault"
version = "0.1.0"
description = "Outlook .msg -> Obsidian LLM wiki: export, convert and lint scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "extract-msg>=0.55",                       # Outlook .msg parsing
    "markdownify>=0.13",                       # HTML-only emails -> markdown
    "pypdf>=5",                                # text from PDF attachments
    "python-docx>=1.1",                        # text from .docx attachments
    "openpyxl>=3.1",                           # text from .xlsx attachments
    "pywin32>=306; sys_platform == 'win32'",   # Outlook COM export (tools/export_outlook_msg.py)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.uv]
# Scripts only, nothing to build or install as a package: `uv sync` just creates .venv with the dependencies.
package = false

[tool.ruff]
line-length = 120
extend-exclude = [".venv", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures read better unwrapped
